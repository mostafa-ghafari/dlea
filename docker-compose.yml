# Dlea AI — Docker Stack (git-based auto-deploy)

services:
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: dlea-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - dlea-internal

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: dlea-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - docker/.env.docker
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - dlea-media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/api/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - dlea-internal

  db:
    image: postgres:16-alpine
    container_name: dlea-postgres
    restart: unless-stopped
    expose:
      - "5432"
    environment:
      POSTGRES_DB: dlea
      POSTGRES_USER: dlea
      POSTGRES_PASSWORD: dlea
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dlea -d dlea"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - dlea-internal

networks:
  dlea-internal:
    driver: bridge

volumes:
  pgdata:
    name: dlea-pgdata
  dlea-media:
    name: dlea-media
