name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install and build frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://dlea.piqagram.ir/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Create deployment archive
        run: |
          tar czf deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.output' \
            --exclude='.tanstack' \
            --exclude='backend/.venv' \
            --exclude='backend/__pycache__' \
            --exclude='*.pyc' \
            --exclude='backend/db.sqlite3' \
            --exclude='.git' \
            --exclude='.freebuff' \
            .

      - name: Copy archive to server and deploy
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete
          path: deploy.tar.gz
          remote_path: /tmp/
          remote_host: ${{ secrets.SERVER_HOST }}
          remote_user: ${{ secrets.SERVER_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Run deployment on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            DEPLOY_DIR="/opt/dlea"
            TIMESTAMP=$(date +%Y%m%d_%H%M%S)
            RELEASE_DIR="$DEPLOY_DIR/releases/$TIMESTAMP"
            CURRENT_LINK="$DEPLOY_DIR/current"
            SHARED_DIR="$DEPLOY_DIR/shared"

            echo "=== Dlea Deployment $TIMESTAMP ==="

            mkdir -p "$RELEASE_DIR" "$SHARED_DIR"
            cd "$RELEASE_DIR"
            tar xzf /tmp/deploy.tar.gz
            rm -f /tmp/deploy.tar.gz

            if [ -f "$SHARED_DIR/backend/.env" ]; then
              ln -sf "$SHARED_DIR/backend/.env" "$RELEASE_DIR/backend/.env"
            fi

            echo "Installing frontend..."
            npm ci 2>/dev/null || npm install

            echo "Building frontend..."
            npm run build

            echo "Setting up backend..."
            cd backend
            python3 -m venv .venv 2>/dev/null || true
            .venv/bin/pip install --upgrade pip -q 2>/dev/null || true
            .venv/bin/pip install -r requirements.txt -q

            echo "Running migrations..."
            .venv/bin/python manage.py migrate --noinput

            cd "$DEPLOY_DIR"
            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK"

            echo "Restarting services..."
            systemctl restart dlea-backend 2>/dev/null || true
            systemctl restart dlea-frontend 2>/dev/null || true
            systemctl reload nginx 2>/dev/null || true

            echo "=== Deployment complete ==="
