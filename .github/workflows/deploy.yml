name: Deploy to Production

on:
  workflow_dispatch:

jobs:
  # Gate: a broken build must never reach the server. Runs the full
  # test suite (backend, frontend, E2E) before packaging anything.
  # build-and-deploy needs this job.
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Run backend tests (SQLite)
        working-directory: backend
        run: python manage.py test api --settings config.settings_test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Frontend unit tests
        run: npm test

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E suite (builds the app with the local API base)
        run: npm run test:e2e

  build-and-deploy:
    runs-on: ubuntu-latest
    needs: checks

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          VITE_API_URL: https://dlea.piqagram.ir/api
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}

      - name: Create deployment package
        run: |
          tar czf dlea-deploy.tar.gz \
            --exclude='node_modules' \
            --exclude='.output' \
            --exclude='.tanstack' \
            --exclude='backend/.venv' \
            --exclude='backend/__pycache__' \
            --exclude='*.pyc' \
            --exclude='backend/db.sqlite3' \
            --exclude='.git' \
            --exclude='.freebuff' \
            .

      - name: Upload deploy package
        uses: actions/upload-artifact@v4
        with:
          name: dlea-deploy-package
          path: dlea-deploy.tar.gz
          retention-days: 3

      - name: Print instructions
        run: |
          echo "=========================================="
          echo "Deployment package is ready!"
          echo "=========================================="
          echo ""
          echo "Since the server is only accessible from MCI network,"
          echo "please download the artifact and deploy locally:"
          echo ""
          echo "1. Download 'dlea-deploy-package' from Artifacts"
          echo "2. Extract it on your local machine"
          echo "3. Run: bash deploy/deploy.sh"
          echo ""
          echo "Or use the local deploy script:"
          echo "  bash deploy/local-deploy.sh"
          echo "=========================================="
