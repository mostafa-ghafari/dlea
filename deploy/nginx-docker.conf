server {
    listen 80;
    server_name dlea.piqagram.ir;

    client_max_body_size 25M;

    # API → backend container
    location /api/ {
        proxy_pass http://backend:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Same reason as deploy/nginx-dlea.conf: the 60s default would return
        # 504 on any coach report slower than a minute.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Media files → backend container
    location /media/ {
        proxy_pass http://backend:8002/media/;
    }

    # Everything else → frontend container (Nuxt SSR)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
