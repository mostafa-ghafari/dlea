# blog.dlea.ir — WordPress container front-door
# Proxies to the dlea-blog container published on 127.0.0.1:8090.
# (8080 on this box belongs to meraat-prod-web-1.)
# Start HTTP-only; `certbot --nginx` adds the 443 block + redirect.

server {
    listen 80;
    listen [::]:80;
    server_name blog.dlea.ir;

    client_max_body_size 64M;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
