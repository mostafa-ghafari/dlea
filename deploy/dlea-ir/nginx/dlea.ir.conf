# dlea.ir — production front-door for the Dlea AI app on 37.255.212.62
# Serves the SAME stack as dlea.piqagram.ir:
#   /        -> 127.0.0.1:3000  (frontend container)
#   /api/    -> 127.0.0.1:8002  (backend container)
#   /media/  -> shared host directory written by the backend container
#
# Start HTTP-only; `certbot --nginx` adds the 443 block + redirect automatically.
# Mirrors the live deploy/nginx-dlea.conf, plus dev.dlea.ir.

server {
    listen 80;
    listen [::]:80;
    server_name dlea.ir www.dlea.ir dev.dlea.ir;

    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /media/ {
        alias /var/www/dlea.piqagram.ir/backend/media/;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
