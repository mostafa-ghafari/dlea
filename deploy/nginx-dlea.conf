# Copy of the vhost that actually serves dlea.piqagram.ir.
#
# It lives on the server as a plain file at
# /etc/nginx/sites-enabled/dlea.piqagram.ir (this host does not use the
# sites-available/sites-enabled symlink convention for this site).
#
# READ THIS FOR REFERENCE ONLY — DO NOT COPY IT OVER THE LIVE FILE. This is an
# excerpt of the vhost: the file on the server also carries a certbot-managed
# `listen 443 ssl` block and the redirect server next to it, added after this
# copy was taken. A whole-file copy silently strips TLS from this host.
#
# Change the live file surgically instead — edit only the `location /api/`
# directives you came for — then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# deploy/deploy.sh reads the /api/ port back out of the live config (so gunicorn
# can never be started on a port nobody proxies to) and compares its
# `proxy_read_timeout` against the coach's Gemini budget on every deploy;
# APPLY_NGINX_VHOST=1 makes it *insert* that timeout into the live file rather
# than overwrite it. deploy/setup-server.sh will not overwrite an existing
# vhost unless you pass --force, and backs it up first.
#
# What the live file looks like today (this excerpt is the plain-HTTP form
# `setup-server.sh` installs on a fresh box; certbot has since edited the live
# one in place):
#
#   * the app's own server block now carries `listen 443 ssl` with the
#     certbot certificate, and serves /api/, /media/ and / over TLS;
#   * a second server block listens on :80 for this name and answers
#     301 → https.
#
# So traffic arrives over TLS at the origin — a plain-HTTP loopback probe of
# /api/ answers 301, which deploy.sh treats as healthy. The box also runs other
# sites' vhosts on :443 (and one on :8000): never bind :8000 here, and never
# replace this file wholesale.
#
# Note: the app processes are owned by PM2, not systemd —
#   dlea-api -> /var/www/dlea.piqagram.ir/backend/.venv/bin/gunicorn on the
#               port below, cwd /var/www/dlea.piqagram.ir/backend
#   dlea     -> npm start (node .output/server/index.mjs) on 3000, cwd
#               /var/www/dlea.piqagram.ir

server {
    listen 80;
    server_name dlea.piqagram.ir;

    # Receipts and avatars are uploaded through the API; the per-image size cap
    # comes from the plan settings in the app.
    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Without these nginx uses its 60s default and answers 504 while the
        # report is still being written — the coach's Gemini call is allowed
        # 75s (GEMINI_CALL_BUDGET_SECONDS) and gunicorn --timeout 120, so a
        # 60s gateway timeout makes a slow-but-successful report unreachable.
        # Must stay at or above gunicorn's timeout so gunicorn, not nginx,
        # reports the failure.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Uploaded files are served straight off disk from MEDIA_ROOT, which is
    # /var/www/dlea.piqagram.ir/backend/media. The deploy syncs code only, so
    # this directory is never touched.
    location /media/ {
        alias /var/www/dlea.piqagram.ir/backend/media/;
    }

    # Everything else is the TanStack SSR server.
    # There is deliberately no /admin/ or /static/ location: Django's own admin
    # is not exposed through nginx (visiting /admin/ lands in the SPA). See
    # DEPLOYMENT-RUNBOOK.md if that ever needs to change.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
